<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tomioka room</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a4a45;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
}
.screen.active {
  display: flex;
}
.screen img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
/* Invisible hotspot overlays */
.hotspot {
  position: absolute;
  cursor: pointer;
  /* background: rgba(255,0,0,0.2); /* debug */
}

/* 家具詳細画面 */
.detail-screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
  z-index: 10;
}
.detail-screen.active {
  display: flex;
}
.detail-screen img {
  max-width: 80%;
  max-height: 80%;
  object-fit: contain;
}
</style>
</head>
<body>

<!-- Screen 1: Splash - tap anywhere -->
<div class="screen active" id="s1">
  <img src="images/s1.png">
  <div class="hotspot" style="inset:0;" onclick="go('s2')"></div>
</div>

<!-- Screen 2: Home (a.m.) -->
<div class="screen" id="s2">
<img src="images/s2.png">
  <!-- Clock hotspot: a.m. label/clock area -->
  <div class="hotspot" style="top:42%;left:10%;width:10%;height:8%;" onclick="go('s3')"></div>
  <!-- Left arrow -->
  <div class="hotspot" style="top:40%;left:0;width:8%;height:20%;" onclick="go('s5')"></div>
  <!-- Right arrow -->
  <div class="hotspot" style="top:40%;right:0;width:8%;height:20%;" onclick="go('s4')"></div>
  <!-- Piano hotspot -->
  <div class="hotspot" style="top:40%;left:50%;width:15%;height:15%;" onclick="openDetail('detail-piano')"></div>
  <!-- Chair1 hotspot -->
  <div class="hotspot" style="top:45%;left:45%;width:8%;height:8%;" onclick="openDetail('detail-chair1')"></div>
  <!-- Chair2 hotspot -->
  <div class="hotspot" style="top:38%;left:55%;width:15%;height:15%;" onclick="openDetail('detail-chair2')"></div>
  <!-- PC hotspot -->
  <div class="hotspot" style="top:40%;left:55%;width:8%;height:8%;" onclick="openDetail('detail-pc')"></div>
</div>

<!-- Screen 3: p.m. view -->
<div class="screen" id="s3">
<img src="images/s3.png">
  <!-- Clock area to toggle back -->
  <div class="hotspot" style="top:42%;left:0;width:22%;height:12%;" onclick="go('s2')"></div>
</div>

<!-- Screen 4: Right perspective -->
<div class="screen" id="s4">
<img src="images/s4.png">
  <!-- Left arrow to go back -->
  <div class="hotspot" style="top:40%;left:0;width:8%;height:20%;" onclick="go('s2')"></div>
</div>

<!-- Screen 5: Left perspective (piano side) -->
<div class="screen" id="s5">
<img src="images/s5.png">
  <!-- Right arrow to go back -->
  <div class="hotspot" style="top:40%;right:0;width:8%;height:20%;" onclick="go('s2')"></div>
</div>

<!-- 家具詳細オーバーレイ -->
<div class="detail-screen" id="detail-piano" onclick="closeDetail('detail-piano')">
  <img src="images/piano.png">
</div>

<div class="detail-screen" id="detail-chair1" onclick="closeDetail('detail-chair1')">
  <img src="images/chair1.png">
</div>

<div class="detail-screen" id="detail-chair2" onclick="closeDetail('detail-chair2')">
  <img src="images/chair2.png">
</div>

<div class="detail-screen" id="detail-pc" onclick="closeDetail('detail-pc')">
  <img src="images/pc.png">
</div>

<script>
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openDetail(id) {
  document.getElementById(id).classList.add('active');
}

function closeDetail(id) {
  document.getElementById(id).classList.remove('active');
}
</script>
</body>
</html>
